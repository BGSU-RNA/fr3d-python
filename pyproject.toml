[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "fr3d"
version = "1.0.0"
description = "Python implementation of FR3D"
authors = [{name="Craig L. Zirbel and others", email="zirbel@bgsu.edu"}]
license = { text = "Apache-2.0"}
dependencies = [
	"numpy",
	"scipy",
	"mmcif-pdbx; python_version>='3.0'",
	"biopython"
]

[tool.setuptools.packages.find]
include = ["fr3d*"]
